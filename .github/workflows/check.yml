# Static checks (node test/check.mjs) on every pull request that touches code. Org rules: pull_request and
# workflow_dispatch only (no push, no schedule). Hosted runner on purpose: this repo is public, the org's self-hosted
# runners do not take public-repo jobs, and fork pull requests must not run on owner machines.
name: check

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "**/*.png"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node test/check.mjs
