# Keeps the GitHub Actions in .github/workflows up to date (one grouped pull request a week).
# There is no package manifest: the extension, the helpers and test/check.mjs have no dependencies.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: ci
